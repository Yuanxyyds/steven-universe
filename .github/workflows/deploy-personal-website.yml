name: Deploy Personal Website to Vercel

on:
  push:
    branches: [ main ]
    paths:
      - 'js/apps/personal-website-new/**'
      - 'js/libs/shared-schemas/**'
      - 'js/package.json'
      - '.github/workflows/deploy-personal-website.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'js/apps/personal-website-new/**'
      - 'js/libs/shared-schemas/**'
      - 'js/package.json'
      - '.github/workflows/deploy-personal-website.yml'
env:
  MONOREPO_ROOT: js

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies (monorepo)
        working-directory: ${{ env.MONOREPO_ROOT }}
        run: npm install

      - name: Build shared schemas
        working-directory: ${{ env.MONOREPO_ROOT }}
        run: npm run build:schemas

      - name: Install native deps (Linux)
        working-directory: ${{ env.MONOREPO_ROOT }}
        run: npm install --no-save lightningcss @tailwindcss/oxide

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # ===== Preview =====
      - name: Pull Preview Env
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.MONOREPO_ROOT }}
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Preview
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.MONOREPO_ROOT }}
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.MONOREPO_ROOT }}
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

      # ===== Production =====
      - name: Pull Production Env
        if: github.event_name == 'push'
        working-directory: ${{ env.MONOREPO_ROOT }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Production
        if: github.event_name == 'push'
        working-directory: ${{ env.MONOREPO_ROOT }}
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Production
        if: github.event_name == 'push'
        working-directory: ${{ env.MONOREPO_ROOT }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}